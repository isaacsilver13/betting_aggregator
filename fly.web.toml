app = "betting-aggregator-web"
primary_region = "ewr"

[build]
dockerfile = "docker/Dockerfile.frontend"

[build.args]
VITE_API_URL = "/api/v1"

[http_service]
internal_port = 80
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/"

[[vm]]
memory = "256mb"
cpus = 1
cpu_kind = "shared"
